<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="CarryState architecture: Claude Code pack → .csb bundle → Codex unpack, merkle-verified">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>

  <!-- connectors: 底层静线 + 顶层行军虚线(数据流) + animateMotion 数据包 -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="210" y1="180" x2="310" y2="180" marker-end="url(#ah-l)"/>
    <line x1="530" y1="180" x2="630" y2="180" marker-end="url(#ah-l)"/>
  </g>
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="210" y1="180" x2="306" y2="180" stroke="#0071E3" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="530" y1="180" x2="626" y2="180" stroke="#5E5CE6" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
  </g>
  <g>
    <circle r="3" fill="#0071E3">
      <animateMotion path="M210,180 L306,180" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M530,180 L626,180" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- connector labels (the two directions: pack, unpack) -->
  <text x="258" y="170" text-anchor="middle" font-size="11" font-weight="500" fill="#6E6E73">pack</text>
  <text x="578" y="170" text-anchor="middle" font-size="11" font-weight="500" fill="#6E6E73">unpack</text>

  <!-- nodes: Claude Code (source/blue) · .csb Bundle (core/purple) · Codex (target/green);
       呼吸 = fill-opacity 0.10↔0.18 spline 缓动，三节点负 begin 错峰 -->
  <g>
    <rect x="40"  y="140" width="170" height="80" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="125" y="178" text-anchor="middle" font-size="15" font-weight="600" fill="#0A4F9E">Claude Code</text>
    <text x="125" y="196" text-anchor="middle" font-size="11" font-weight="400" fill="#6E6E73">~/.claude</text>

    <rect x="355" y="140" width="170" height="80" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.1s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="178" text-anchor="middle" font-size="15" font-weight="600" fill="#4B3FC4">.csb Bundle</text>
    <text x="440" y="196" text-anchor="middle" font-size="11" font-weight="400" fill="#6E6E73">merkle-rooted</text>

    <rect x="670" y="140" width="170" height="80" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="755" y="178" text-anchor="middle" font-size="15" font-weight="600" fill="#0B6B53">Codex</text>
    <text x="755" y="196" text-anchor="middle" font-size="11" font-weight="400" fill="#6E6E73">~/.codex</text>
  </g>

  <!-- verify loopback: a self-loop on the bundle node showing the integrity check -->
  <g fill="none" stroke="#6E6E73" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.7">
    <path d="M 440 220 q 0 36 36 18 q 24 -10 -6 -28" marker-end="url(#ah-l)">
      <animate attributeName="stroke-dashoffset" from="14" to="0" dur="2s" repeatCount="indefinite"/>
    </path>
    <text x="498" y="276" text-anchor="middle" font-size="11" font-weight="500" fill="#6E6E73">verify</text>
  </g>

  <!-- bottom caption: the airgap guarantee -->
  <text x="440" y="328" text-anchor="middle" font-size="12" font-weight="500" fill="#6E6E73">数据不出境 — no network, no cloud, one binary, three subcommands</text>
</svg>
